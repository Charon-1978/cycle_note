# .github/workflows/release.yml
#
# 打 tag（v1.1.0）→ 自动构建 APK → 发布 GitHub Release → 更新 update/latest.json。
#
# 为什么要在 CI 里跑而不是本地：签名与产物必须可复现；
# 也让"GitHub 通道"始终有可下载的正式 APK。
#
# 需要配置的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   KEYSTORE_BASE64   release keystore 的 base64（`base64 -w0 key.jks`）
#   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # 签名材料：没有 Secrets 时用 debug 签名（仅用于自测）
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/yueji-release.jks
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=APP_VERSION=${APP_VERSION#v}
          cp build/app/outputs/flutter-apk/app-release.apk "yueji-${APP_VERSION#v}-arm64.apk"

      - name: Checksums
        run: |
          sha256sum "yueji-${GITHUB_REF_NAME#v}-arm64.apk" | tee sha256.txt
          echo "SIZE=$(stat -c%s yueji-${GITHUB_REF_NAME#v}-arm64.apk)" >> "$GITHUB_ENV"
          echo "SHA=$(cut -d' ' -f1 sha256.txt)" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yueji-*-arm64.apk
            sha256.txt
          generate_release_notes: true

      # 让 raw/latest.json 指向刚发布的 APK（GitHub 通道）
      - name: Update update/latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          cat > update/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "$(git log -1 --pretty=%s | sed 's/"/\\"/g')",
            "apkUrl": "https://github.com/${REPO}/releases/download/v${VERSION}/yueji-${VERSION}-arm64.apk",
            "sha256": "${SHA}",
            "size": ${SIZE},
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add update/latest.json
          git commit -m "chore(update): latest.json → ${VERSION}" || echo "no changes"
          git push origin main
